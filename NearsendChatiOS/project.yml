name: NearsendChat
options:
  bundleIdPrefix: app.nearsend
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "12"
targets:
  NearsendChat:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Nearsend Chat
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleLocalizations: [en, sv, es, fr, de, pt, it, ar, tr, ru, zh-Hans, ja]
        UIAppFonts: [Anton-Regular.ttf]
        NSBluetoothAlwaysUsageDescription: Nearsend Chat uses Bluetooth to find and message people near you without internet.
        ITSAppUsesNonExemptEncryption: false   # only Apple's CryptoKit (exempt); answered in App Store Connect on 25 Nov 2026
        NSFaceIDUsageDescription: Nearsend Chat uses Face ID to open the app or chats you have locked.
        NSMicrophoneUsageDescription: Only used while you hold the microphone button to record a voice message.
        NSCameraUsageDescription: Used when you take a photo to send in a chat or scan a friend's QR code. Nothing is recorded or uploaded.
        NSLocationWhenInUseUsageDescription: Only used when you share your location in a chat or send an SOS, so people nearby can find you.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        # "Move to another phone" file (.nearsend): AirDrop and Files open it in the app
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.nearsend.chat.transfer
            UTTypeDescription: Nearsend transfer file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nearsend]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nearsend transfer file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [app.nearsend.chat.transfer]
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nearsend.chat
        DEVELOPMENT_TEAM: HW9XRXBJZA
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  NearsendChat:
    build:
      targets:
        NearsendChat: all
    run:
      config: Debug
      commandLineArguments:
        "-realBluetooth YES": true   # simulator: use real Core Bluetooth (shows the prompts) instead of demo data
    archive:
      config: Release
